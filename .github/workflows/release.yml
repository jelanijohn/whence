# Builds Whence installers for Windows, macOS (Apple Silicon + Intel), and
# Linux whenever a version tag (v*) is pushed, and attaches them to a draft
# GitHub release. Publish the draft manually once you've sanity-checked the
# artifacts.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    # Job-level so step `if:` guards can test it — secrets aren't readable in
    # `if:` directly. Empty on forks, which cleanly skips the signing steps.
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v7

      # webkit2gtk 4.1 is the Tauri v2 baseline; ayatana-appindicator backs the
      # tray icon on Linux.
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libxdo-dev \
            libssl-dev libgtk-3-dev

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Intel macOS is cross-compiled from the Apple Silicon runner.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.args }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # The tag is the source of truth for the release version: v0.2.0 →
      # 0.2.0 stamped into tauri.conf.json before bundling, so the in-repo
      # version never needs a manual bump to cut a release.
      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > tauri.conf.tmp
          mv tauri.conf.tmp src-tauri/tauri.conf.json

      # Windows code signing via Azure Trusted Signing. Tauri's bundler invokes
      # trusted-signing-cli on every produced binary/installer through the
      # signCommand hook patched in below (kept out of the committed config so
      # local Windows builds stay unsigned). Skipped entirely when the Azure
      # secrets are absent. Required secrets:
      #   AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET
      #     Entra app registration holding the "Trusted Signing Certificate
      #     Profile Signer" role on the signing account
      #   AZURE_SIGNING_ENDPOINT   region URI, e.g. https://eus.codesigning.azure.net
      #   AZURE_SIGNING_ACCOUNT    Trusted Signing account name
      #   AZURE_SIGNING_PROFILE    certificate profile name
      - name: Install trusted-signing-cli
        if: matrix.platform == 'windows-latest' && env.AZURE_CLIENT_ID != ''
        run: cargo install trusted-signing-cli --locked

      - name: Enable Windows signing
        if: matrix.platform == 'windows-latest' && env.AZURE_CLIENT_ID != ''
        shell: bash
        run: |
          jq --arg cmd "trusted-signing-cli -e ${{ secrets.AZURE_SIGNING_ENDPOINT }} -a ${{ secrets.AZURE_SIGNING_ACCOUNT }} -c ${{ secrets.AZURE_SIGNING_PROFILE }} %1" \
            '.bundle.windows.signCommand = $cmd' src-tauri/tauri.conf.json > tauri.conf.tmp
          mv tauri.conf.tmp src-tauri/tauri.conf.json

      # macOS code signing + notarization. tauri-action picks these up on the
      # macOS runners and skips signing when APPLE_CERTIFICATE is unset, so the
      # workflow still works on forks without the secrets. Required secrets:
      #   APPLE_CERTIFICATE          base64 of the Developer ID Application .p12
      #   APPLE_CERTIFICATE_PASSWORD password set when exporting the .p12
      #   APPLE_SIGNING_IDENTITY     "Developer ID Application: <Name> (<TEAMID>)"
      #   APPLE_ID                   Apple ID email for notarization
      #   APPLE_PASSWORD             app-specific password (appleid.apple.com)
      #   APPLE_TEAM_ID              10-char team ID
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # trusted-signing-cli authenticates with these (EnvironmentCredential).
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Whence v__VERSION__'
          releaseBody: 'See the assets below to download and install this version.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # Attach the browser-extension zip (the load-unpacked fallback,
  # docs/extension-distribution.md §7) to the same draft release. The extension
  # versions independently of the app — the script names the zip from
  # extension/manifest.json, so a v0.5.0 app release can legitimately carry
  # whence-extension-v0.4.0.zip. The Chrome Web Store upload stays manual.
  package-extension:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Package extension
        run: ./scripts/package-extension.sh

      - name: Attach to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" whence-extension-v*.zip --clobber
