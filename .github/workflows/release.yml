# Builds Whence installers for Windows, macOS (Apple Silicon + Intel), and
# Linux whenever a version tag (v*) is pushed, and attaches them to a draft
# GitHub release. Publish the draft manually once you've sanity-checked the
# artifacts.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  # Lets the job request a GitHub OIDC token; azure/login exchanges it for the
  # Windows-signing session, so no Azure client secret lives in the repo.
  id-token: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    # The Entra federated credential is bound to this environment name: the
    # OIDC subject claim becomes repo:<owner>/<repo>:environment:release, which
    # sidesteps Entra's no-wildcards rule on tag-ref subjects (a plain tag
    # trigger would need one credential per tag). Rename the environment and
    # the federated credential together, or signing breaks.
    environment: release
    # Job-level so step `if:` guards can test it — secrets aren't readable in
    # `if:` directly. Empty on forks, which cleanly skips the signing steps.
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v7

      # webkit2gtk 4.1 is the Tauri v2 baseline; ayatana-appindicator backs the
      # tray icon on Linux.
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libxdo-dev \
            libssl-dev libgtk-3-dev

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Intel macOS is cross-compiled from the Apple Silicon runner.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.args }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # The tag is the source of truth for the release version: v0.2.0 →
      # 0.2.0 stamped into tauri.conf.json before bundling, so the in-repo
      # version never needs a manual bump to cut a release.
      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > tauri.conf.tmp
          mv tauri.conf.tmp src-tauri/tauri.conf.json

      # Windows code signing via Azure Artifact Signing (né Trusted Signing),
      # authenticated with GitHub's OIDC token — no client secret to store or
      # rotate. azure/login exchanges the token for an Azure CLI session; the
      # Trusted Signing signtool dlib then authenticates through that session
      # (DefaultAzureCredential falling through to AzureCliCredential — the
      # metadata.json excludes every other credential source so nothing hangs
      # probing IMDS). Tauri invokes the patched-in signCommand once per
      # artifact (exe, then each installer), so everything ships signed and
      # timestamped; the hook stays out of the committed config so local
      # Windows builds remain unsigned. Skipped entirely when the Azure
      # secrets are absent (forks build unsigned). Required secrets:
      #   AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_SUBSCRIPTION_ID
      #     Entra app registration with a federated credential for this repo's
      #     "release" environment and the "Artifact Signing Certificate Profile
      #     Signer" role on the signing account
      #   AZURE_SIGNING_ENDPOINT   region URI, e.g. https://eus.codesigning.azure.net
      #   AZURE_SIGNING_ACCOUNT    signing account name
      #   AZURE_SIGNING_PROFILE    certificate profile name
      - name: Azure login (OIDC)
        if: matrix.platform == 'windows-latest' && env.AZURE_CLIENT_ID != ''
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Enable Windows signing
        if: matrix.platform == 'windows-latest' && env.AZURE_CLIENT_ID != ''
        shell: pwsh
        run: |
          # Microsoft.Trusted.Signing.Client was delisted in the Artifact
          # Signing rebrand; the successor package keeps the same bin layout.
          nuget install Microsoft.ArtifactSigning.Client -x -OutputDirectory "$env:RUNNER_TEMP\tsc"
          $dlib = "$env:RUNNER_TEMP\tsc\Microsoft.ArtifactSigning.Client\bin\x64\Azure.CodeSigning.Dlib.dll"
          if (!(Test-Path $dlib)) { throw "Trusted Signing dlib not found at $dlib" }
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' |
            Sort-Object FullName | Select-Object -Last 1 -ExpandProperty FullName
          $metadata = "$env:RUNNER_TEMP\tsc\metadata.json"
          @{
            Endpoint               = '${{ secrets.AZURE_SIGNING_ENDPOINT }}'
            CodeSigningAccountName = '${{ secrets.AZURE_SIGNING_ACCOUNT }}'
            CertificateProfileName = '${{ secrets.AZURE_SIGNING_PROFILE }}'
            ExcludeCredentials     = @(
              'EnvironmentCredential', 'WorkloadIdentityCredential',
              'ManagedIdentityCredential', 'SharedTokenCacheCredential',
              'VisualStudioCredential', 'VisualStudioCodeCredential',
              'AzurePowerShellCredential', 'AzureDeveloperCliCredential',
              'InteractiveBrowserCredential'
            )
          } | ConvertTo-Json | Set-Content $metadata
          # Object form, not a plain string: Tauri splits a string signCommand
          # on whitespace, which would mangle the spaced Windows Kits path.
          $filter = '.bundle.windows.signCommand = {cmd: $st, args: ["sign", "/v", "/fd", "SHA256", "/tr", "http://timestamp.acs.microsoft.com", "/td", "SHA256", "/dlib", $dlib, "/dmdf", $md, "%1"]}'
          jq --arg st "$signtool" --arg dlib "$dlib" --arg md "$metadata" $filter src-tauri/tauri.conf.json | Set-Content tauri.conf.tmp
          Move-Item -Force tauri.conf.tmp src-tauri/tauri.conf.json

      # macOS code signing + notarization. tauri-action picks these up on the
      # macOS runners and skips signing when APPLE_CERTIFICATE is unset, so the
      # workflow still works on forks without the secrets. Required secrets:
      #   APPLE_CERTIFICATE          base64 of the Developer ID Application .p12
      #   APPLE_CERTIFICATE_PASSWORD password set when exporting the .p12
      #   APPLE_SIGNING_IDENTITY     "Developer ID Application: <Name> (<TEAMID>)"
      #   APPLE_ID                   Apple ID email for notarization
      #   APPLE_PASSWORD             app-specific password (appleid.apple.com)
      #   APPLE_TEAM_ID              10-char team ID
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Whence v__VERSION__'
          releaseBody: 'See the assets below to download and install this version.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # Attach the browser-extension zip (the load-unpacked fallback,
  # docs/extension-distribution.md §7) to the same draft release. The extension
  # versions independently of the app — the script names the zip from
  # extension/manifest.json, so a v0.5.0 app release can legitimately carry
  # whence-extension-v0.4.0.zip. The Chrome Web Store upload stays manual.
  package-extension:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Package extension
        run: ./scripts/package-extension.sh

      - name: Attach to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" whence-extension-v*.zip --clobber
